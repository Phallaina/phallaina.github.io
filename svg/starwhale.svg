<svg viewBox="0 0 520 380" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor">
  <defs>
    <!-- 五角星，半径 10，中心 (0,0) -->
    <path id="star" d="M0,-10 L2.3,-3.1 L9.5,-3.1 L3.7,1.2 L5.9,8.1 L0,3.8 L-5.9,8.1 L-3.7,1.2 L-9.5,-3.1 L-2.3,-3.1 Z"/>
  </defs>

  <!-- 星轨 / 海平线：贯穿画面的一条轻柔弧线，撑起构图的大气感 -->
  <path d="M36,268 Q260,322 500,260" stroke-width="1.2" opacity="0.55"/>

  <!-- 鲸身：圆润头 → 平缓背脊 → 上扬分叉尾，一笔连通，占画面主体 -->
  <path d="M80,216
           C88,176 128,156 172,148
           C232,138 292,138 330,146
           C356,152 376,162 392,176
           L448,124
           C436,146 424,152 408,154
           L414,224
           C404,192 392,182 376,178
           C338,204 268,214 204,212
           C150,210 108,208 86,214 Z"
        stroke-width="2.8" stroke-linejoin="round"/>

  <!-- 背鳍 -->
  <path d="M238,142 C246,122 260,116 263,138" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 眼睛（实心） -->
  <circle cx="130" cy="182" r="4.2" fill="currentColor" stroke="none"/>

  <!-- 主星：头顶上方，星鲸的"星" -->
  <use href="#star" transform="translate(170,92) scale(1.7)" fill="currentColor" stroke="none"/>

  <!-- 点缀星（大而少，克制） -->
  <use href="#star" transform="translate(466,88) scale(1.0)"/>
  <use href="#star" transform="translate(300,252) scale(0.8)"/>
  <use href="#star" transform="translate(58,138) scale(0.9)"/>
  <use href="#star" transform="translate(226,246) scale(0.6)"/>
  <use href="#star" transform="translate(452,196) scale(0.7)"/>
</svg>
