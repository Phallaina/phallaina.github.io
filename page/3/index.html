  <script>
  (function () {
    var htmlEl = document.documentElement;
    var themeBtn = document.getElementById("themeBtn");
    function updateBtn(t) { themeBtn.textContent = t === "dark" ? "浅色模式" : "暗色模式"; }
    function loadTheme() {
      var saved = null;
      try { saved = localStorage.getItem("mist-theme"); } catch (e) {}
      if (saved) { htmlEl.setAttribute("data-theme", saved); updateBtn(saved); }
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        htmlEl.setAttribute("data-theme", "dark"); updateBtn("dark");
      }
    }
    themeBtn.addEventListener("click", function () {
      var cur = htmlEl.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : "dark";
      htmlEl.setAttribute("data-theme", next);
      try { localStorage.setItem("mist-theme", next); } catch (e) {}
      updateBtn(next);
    });
    loadTheme();

    var toTop = document.getElementById("toTop");
    window.addEventListener("scroll", function () {
      toTop.classList.toggle("show", window.scrollY > 0);
    });
    toTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    
    var toc = document.querySelector(".toc");
    if (toc) {
      var links = toc.querySelectorAll("a");
      var headings = [];
      links.forEach(function (a) {
        var id = a.getAttribute("href").slice(1);
        var el = document.getElementById(id);
        if (el) headings.push({ el: el, link: a });
      });
      window.addEventListener("scroll", function () {
        var pos = window.scrollY + 100;
        var current = null;
        headings.forEach(function (h) {
          if (h.el.offsetTop <= pos) current = h;
        });
        links.forEach(function (a) { a.classList.remove("active"); });
        if (current) current.link.classList.add("active");
      });
    }
  })();
</script>
